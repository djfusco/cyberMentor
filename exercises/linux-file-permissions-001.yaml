id: linux-file-permissions-001

title: Secure a File with Linux Permissions

description: >
  Practice creating directories and files and applying appropriate
  filesystem permissions.

instructions: |
  Using Terminal:

  1. Create a directory named secure-data in your home directory.
  2. Create a file named secrets.txt inside secure-data.
  3. Configure secrets.txt so that only the owner can read and write it.
  4. Verify the permissions before finishing the exercise.

environment:
  type: terminal

expected_outcomes:
  - id: directory_created
    description: ~/secure-data exists
    student_demonstration: >
      The student ran a command that creates the directory (e.g. mkdir
      secure-data) during this session. A listing or window title merely
      showing the directory already exists is not evidence of creating it --
      it could pre-date this session.
    type: filesystem
    weight: 20

  - id: file_created
    description: ~/secure-data/secrets.txt exists
    student_demonstration: >
      The student ran a command that creates the file (e.g. touch
      secrets.txt, or a redirect/editor save that produces it) during this
      session. A listing merely showing the file already exists is not
      evidence of creating it -- it could pre-date this session.
    type: filesystem
    weight: 20

  - id: permissions_correct
    description: ~/secure-data/secrets.txt has mode 600
    student_demonstration: >
      The student ran a command that sets the mode to 600 (e.g. chmod 600
      secrets.txt) during this session.
    type: filesystem
    weight: 40

  - id: permissions_verified
    description: Student made a reasonable attempt to verify permissions
    student_demonstration: >
      The student produced output that visibly establishes the file's
      permissions -- e.g. a long-format directory listing (ls -l or
      equivalent), stat, or getfacl output showing a permission mode, owner,
      and the filename. The exact command text need not be legible (OCR is
      often imperfect); it is the structure of the output -- a permission
      string, owner, size, date, and filename together -- that demonstrates
      this, not any single exact command spelling. Do not require the
      literal text "ls -l".
    type: observed_behavior
    weight: 20

acceptable_methods:
  - Student may cd into secure-data before creating the file.
  - Student may use relative paths.
  - Student may use absolute paths.
  - Student may use any valid shell commands that produce the correct result.

prohibited_behaviors:
  - Setting the file permissions to 777 should not count as correct.

mentor:
  allow_questions: true
  default_help_level: 2
  reveal_answer: false
